    - tag: li
      description: 大模型推理系统、Serving、调度、KV Cache、投机解码、PD 分离、量化及 GPU 算子优化。
      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: GPU kernel optimization
          keyword_cn: GPU 算子优化
          query: GPU kernel optimization
        - keyword: disaggregated inference
          keyword_cn: 分离式推理 / PD 分离
          query: disaggregated inference
        - keyword: speculative decoding
          keyword_cn: 投机解码
          query: speculative decoding
        - keyword: KV cache
          keyword_cn: KV 缓存
          query: KV cache
        - keyword: LLM serving
          keyword_cn: 大语言模型服务系统
          query: LLM serving
        - keyword: LLM inference
          keyword_cn: 大语言模型推理
          query: LLM inference
      intent_queries:
        - query: >-
            GPU kernels, low precision quantization, communication, and systems optimizations for high performance LLM
            inference.
          query_cn: 关注 GPU kernel、低精度量化、通信和系统级推理性能优化
          enabled: true
          source: manual
          note: ''
        - query: Speculative decoding and other techniques that reduce LLM decoding latency or increase serving throughput.
          query_cn: 关注投机解码及降低延迟、提高吞吐的解码优化
          enabled: true
          source: manual
          note: ''
        - query: >-
            KV cache management, prefix caching, attention optimization, and prefill decode disaggregation for LLM
            serving.
          query_cn: 关注 KV Cache、前缀缓存、Attention 优化和 PD 分离
          enabled: true
          source: manual
          note: ''
        - query: Efficient LLM inference and serving systems with scheduling, continuous batching, and memory management.
          query_cn: 关注 LLM 推理服务中的调度、连续批处理和内存管理
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-08-18T17:21:51.801Z'
    - tag: dse
      description: 设计空间探索
      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: LLM-driven design space exploration
          keyword_cn: 大模型驱动的设计空间探索
          query: LLM-driven design space exploration
        - keyword: Bayesian optimization
          keyword_cn: 贝叶斯优化
          query: Bayesian optimization for hardware
        - keyword: EDA optimization
          keyword_cn: EDA 优化
          query: EDA optimization
        - keyword: high-level synthesis
          keyword_cn: 高层次综合
          query: high-level synthesis
        - keyword: hardware design space exploration
          keyword_cn: 硬件设计空间探索
          query: hardware design space exploration
        - keyword: design space exploration
          keyword_cn: 设计空间探索
          query: design space exploration
      intent_queries:
        - query: >-
            Automated parameter tuning and search for physical design flows such as OpenROAD/ORFS, synthesis, placement,
            routing, or compiler optimization.
          query_cn: OpenROAD/ORFS、综合、布局布线及编译流程中的自动参数调优
          enabled: true
          source: manual
          note: ''
        - query: LLM or agent based methods for automated EDA, HLS pragma tuning, and design space exploration.
          query_cn: LLM / Agent 驱动的 EDA、HLS pragma 调优和 DSE
          enabled: true
          source: manual
          note: ''
        - query: >-
            Multi objective optimization of latency, PPA, resource usage, and feasibility in HLS and chip design
            automation.
          query_cn: HLS 和芯片自动化中的 latency、PPA、资源与可行性多目标优化
          enabled: true
          source: manual
          note: ''
        - query: >-
            Design space exploration for hardware, HLS, compiler, or EDA flows using Bayesian optimization, surrogate
            models, evolutionary search, or active learning.
          query_cn: 利用 BO、代理模型、进化搜索或主动学习进行硬件/HLS/EDA DSE
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-08-18T17:21:48.009Z'
